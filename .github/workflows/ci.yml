name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inspect_dokploy:
        description: Inspect Dokploy configuration without deploying
        type: boolean
        default: false
      configure_dokploy:
        description: Configure the production source branch and pinned Railpack without deploying
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    name: Dokploy setup
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.inspect_dokploy || inputs.configure_dokploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL || 'https://app.dokploy.com' }}
      DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID || 'solidprojects-frontend-sb6wn2' }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      APP_URL: ${{ vars.APP_URL || 'https://solid.typesayfe.com' }}
      CONFIGURE_DOKPLOY: ${{ inputs.configure_dokploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Inspect or configure without deploying
        run: |
          if [ "$CONFIGURE_DOKPLOY" = "true" ]; then
            git ls-remote --exit-code origin refs/heads/production
            bun scripts/deploy.mjs --configure
          else
            bun scripts/deploy.mjs --inspect
          fi

  validate:
    name: Validate
    if: github.event_name != 'workflow_dispatch' || (!inputs.inspect_dokploy && !inputs.configure_dokploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun --bun run check
      - run: bun --bun run test:ci
      - run: bun --bun run test:backend
      - run: bun --bun run build
      - run: bun --bun run test:smoke
      - run: bunx --bun playwright install --with-deps chromium
      - name: Check isolated Neon credentials
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -n "$NEON_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Neon integration skipped: NEON_API_KEY is unavailable (including public fork PRs). Running public-route browser checks."
          fi
      - name: Install pinned Neon CLI
        if: steps.neon.outputs.enabled == 'true'
        run: bun install -g neon@9.4.0
      - name: Prepare isolated Neon branch
        id: neon_prepare
        if: steps.neon.outputs.enabled == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bun scripts/ci-neon.mjs prepare
      - name: Migrate isolated Neon schema
        if: steps.neon.outputs.enabled == 'true'
        run: bun --env-file=.env.neon-ci.local scripts/migrate.ts
      - name: Run full browser integration suite
        if: steps.neon.outputs.enabled == 'true'
        run: bun --env-file=.env.neon-ci.local --bun run test
      - name: Run public-route browser checks
        if: steps.neon.outputs.enabled != 'true'
        run: bun --bun run test --grep 'sign-in offers|all dashboard views require|health'
      - name: Delete isolated Neon branch
        if: ${{ always() && steps.neon_prepare.outcome != 'skipped' && steps.neon_prepare.outcome != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bun scripts/ci-neon.mjs cleanup
      - name: Upload browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.inspect_dokploy && !inputs.configure_dokploy && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ vars.APP_URL || 'https://solid.typesayfe.com' }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL || 'https://app.dokploy.com' }}
      DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID || 'solidprojects-frontend-sb6wn2' }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      APP_URL: ${{ vars.APP_URL || 'https://solid.typesayfe.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Promote tested commit
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          for key in DOKPLOY_URL DOKPLOY_APPLICATION_ID DOKPLOY_API_KEY APP_URL; do
            if [[ -z "${!key}" ]]; then
              echo "Missing deployment setting: $key" >&2
              exit 1
            fi
          done
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded main commit"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun scripts/deploy.mjs --preflight
          git push origin "$GITHUB_SHA:refs/heads/production"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Deploy and verify
        if: steps.promote.outputs.deploy == 'true'
        run: bun scripts/deploy.mjs
